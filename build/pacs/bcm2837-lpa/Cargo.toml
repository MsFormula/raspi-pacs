[package]
name = "bcm2837-lpa"
version = "1.0.0"
authors = ["Po-Yi Tsai <abt8601@protonmail.ch>", "June Fitzloff <junefitzloff@gmail.com>"]
edition = "2024"
rust-version = "1.85.0"
description = "Peripheral access crate for BCM2837 found in the Raspberry Pi 3 and Zero 2W."
repository = "https://github.com/MsFormula/raspi-pacs"
license-file = "LICENSE.txt"
keywords = ["raspberrypi", "bcm2837", "pac", "no_std"]
categories = ["embedded", "hardware-support", "no-std", "no-std::no-alloc"]

[lib]
test = false
bench = false

[features]

vcmailbox = []
cm_pcm = []
cm_pwm = ["cm_pcm"]
gpio = []
systmr = []
uart0 = []
spi0 = []
bsc0 = []
pwm0 = []
bsc1 = ["bsc0"]
bsc2 = ["bsc0"]
aux = []
uart1 = []
spi1 = []
spi2 = ["spi1"]
lic = []
usb_otg_global = []
usb_otg_host = []
usb_otg_device = []
usb_otg_pwrclk = []
emmc = []
dma = []
pcm = []

all = ["vcmailbox" ,"cm_pcm" ,"cm_pwm" ,"gpio" ,"systmr" ,"uart0" ,"spi0" ,"bsc0" ,"pwm0" ,"bsc1" ,"bsc2" ,"aux" ,"uart1" ,"spi1" ,"spi2" ,"lic" ,"usb_otg_global" ,"usb_otg_host" ,"usb_otg_device" ,"usb_otg_pwrclk" ,"emmc" ,"dma" ,"pcm"]

[package.metadata.docs.rs]
features = ["all"]
